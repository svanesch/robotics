# Small VLA (ResNet18 + text + state -> action chunk). Everything the training script reads.
dataset: datasets/so101_v1
run_name: r4
chunk: 16
batch_size: 32
lr: 1.0e-4
backbone_lr: 2.0e-5
weight_decay: 1.0e-4
lang_lr: 3.0e-4          # prompt-grounding parameters (text encoder, FiLM, readout) learn faster
early_frame_weight: 3.0  # sampling weight of the first `early_frames` frames of each episode (target selection)
early_frames: 50
grad_clip: 10.0
steps: 12000            # optimizer steps (~0.35 s each on the P1000); evaluate on val every eval_every
eval_every: 1000
log_every: 100
val_batches: 60
warmup_steps: 500
num_workers: 4
seed: 0
amp: false              # P1000 has no fast fp16
freeze_backbone_modules: 5   # ResNet18 stem (conv,bn,relu,pool) + layer1 frozen: 33% faster steps
model:
  d_model: 256
  enc_layers: 4
  dec_layers: 4
  ff: 1024
  dropout: 0.1
  pretrained: true
  image_size: 128
augment:
  shift: 8              # random translation in pixels (pad + crop)
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2

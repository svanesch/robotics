[workspace]
name = "robotics"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pyyaml = "*"
pyarrow = "*"
imageio = "*"
imageio-ffmpeg = "*"
ffmpeg = ">=6"
pytest = "*"
pytorch = { version = "2.8.*", build = "cuda129*" }
torchvision = "*"
tensorboard = "*"

[pypi-dependencies]
mujoco = ">=3.3"
gymnasium = "*"
robotics = { path = ".", editable = true }

[activation.env]
MUJOCO_GL = "egl"
IMAGEIO_FFMPEG_EXE = "$CONDA_PREFIX/bin/ffmpeg"

[tasks]
test = "pytest -q tests"
view = { cmd = "python scripts/view.py", env = { MUJOCO_GL = "glfw" } }
collect = "python scripts/collect.py"
train = "python scripts/train.py"
evaluate = "python scripts/evaluate.py"
run-policy = "python scripts/run_policy.py"
demo = { cmd = "python scripts/run_policy.py --interactive", env = { MUJOCO_GL = "glfw" } }
inspect-data = "python scripts/inspect_dataset.py"
benchmark = "python scripts/benchmark.py"
